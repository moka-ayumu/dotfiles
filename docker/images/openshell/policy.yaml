version: 1

# Toolchains live in /nix/store, which the built-in default policy does not
# cover. /nix is read-write so projects can install more at runtime.
filesystem_policy:
  include_workdir: true
  read_only:
    - /bin
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
    - /var/log
  read_write:
    - /nix
    - /tmp
    - /dev/null
    # nix builds open a pty.
    - /dev/ptmx
    - /dev/pts

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  nix:
    name: nix
    endpoints:
      - { host: cache.nixos.org, port: 443 }
      - { host: channels.nixos.org, port: 443 }
      - { host: releases.nixos.org, port: 443 }
      - { host: github.com, port: 443 }
      - { host: api.github.com, port: 443 }
      - { host: codeload.github.com, port: 443 }
      - { host: static.rust-lang.org, port: 443 }
    binaries:
      - { path: "/nix/store/**" }

  npm:
    name: npm
    endpoints:
      # Scoped packages are requested as /@scope%2fname, so the encoded '/'
      # must be allowed explicitly; that option only exists on REST endpoints.
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        access: full
        allow_encoded_slash: true
    binaries:
      - { path: "/nix/store/**" }

  # Claude Desktop over SSH installs its remote server and a pinned Claude Code
  # CLI under ~/.claude/remote/{srv/<hash>/server,ccd-cli/<version>}. Only
  # those two binaries get out; telemetry and error reporting stay blocked.
  claude_code:
    name: claude_code
    endpoints:
      - { host: api.anthropic.com, port: 443 }
    binaries:
      - { path: "/sandbox/.claude/remote/ccd-cli/*" }

  claude_remote_server:
    name: claude_remote_server
    endpoints:
      - { host: downloads.claude.ai, port: 443 }
    binaries:
      - { path: "/sandbox/.claude/remote/srv/*/server" }
